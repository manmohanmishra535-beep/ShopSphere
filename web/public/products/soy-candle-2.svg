<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#edf1ec"/>
      <stop offset="1" stop-color="#d5ded5"/>
    </linearGradient>
    <radialGradient id="glow" cx="32%" cy="18%" r="78%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcd2be"/>
      <stop offset="0.55" stop-color="#d5c9b2"/>
      <stop offset="1" stop-color="#afa592"/>
    </linearGradient>
    <linearGradient id="bodySoft" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#e3dbcc"/>
      <stop offset="1" stop-color="#d5c9b2"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
