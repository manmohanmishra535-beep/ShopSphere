<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f3eee4"/>
      <stop offset="1" stop-color="#ded4c4"/>
    </linearGradient>
    <radialGradient id="glow" cx="32%" cy="18%" r="78%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d4b889"/>
      <stop offset="0.55" stop-color="#ccab72"/>
      <stop offset="1" stop-color="#a78c5d"/>
    </linearGradient>
    <linearGradient id="bodySoft" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#ddc8a2"/>
      <stop offset="1" stop-color="#ccab72"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3eee2"/>
      <stop offset="0.35" stop-color="#cdbfa6"/>
      <stop offset="0.62" stop-color="#f8f3e8"/>
      <stop offset="1" stop-color="#9d8b70"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.11"/></feComponentTransfer>
    </filter>
    <filter id="objectShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="14" flood-color="#2f2a24" flood-opacity="0.2"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="4"/></filter>
    
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow)"/>
